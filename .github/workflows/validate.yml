name: validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx prettier --check "app/**/*.{ts,tsx}" "src/**/*.{ts,tsx}" "modules/**/src/*.ts"
      - run: npx expo export --platform android --output-dir /tmp/export
