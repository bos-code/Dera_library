plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.deradocumentscanner'
version = '0.2.0'

android {
  namespace "expo.modules.deradocumentscanner"
  defaultConfig {
    versionCode 1
    // Required by expo-module-gradle-plugin (SDK 57+) for its local Maven publication.
    versionName "0.2.0"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
  // On-device text recognition for scanned PDFs. The bundled model works offline and without Play services.
  implementation "com.google.mlkit:text-recognition:16.0.1"
}
